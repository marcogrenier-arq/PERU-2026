name: Monitor Machu Picchu - Setembro 2026

on:
  workflow_dispatch:

  schedule:
    # Horários exatos em Lima, Peru
    # 06:00, 07:00, 12:00, 15:00, 17:00 e 19:00
    - cron: '0 6,7,12,15,17,19 1-7 9 *'
      timezone: "America/Lima"

    # 06:30, 09:30, 13:30 e 21:30
    - cron: '30 6,9,13,21 1-7 9 *'
      timezone: "America/Lima"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Consultar TuBoleto
        shell: bash

        run: |
          python <<'PY'

          import urllib.request
          import urllib.error
          import json
          import hmac
          import hashlib
          import base64
          import re

          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo


          # ============================================================
          # CONFIGURAÇÃO
          # ============================================================

          API = "https://api-tuboleto.cultura.pe"

          LUGAR = "llaqta_machupicchu"

          PUNTO = 5

          TOTAL_COTA = 1000

          SECURITY_VALUE = "5t4jPtv4LpmGgWU7ZYk8FhZf5LNTpk"

          HEADERS = {
              "Accept": "application/json, text/plain, */*",
              "User-Agent": "Mozilla/5.0",
              "Origin": "https://tuboleto.cultura.pe",
              "Referer": "https://tuboleto.cultura.pe/"
          }


          # ============================================================
          # REQUISIÇÃO HTTP
          # ============================================================

          def request_json(url, method="GET", payload=None):

              headers = dict(HEADERS)

              data = None

              if payload is not None:

                  data = json.dumps(
                      payload
                  ).encode("utf-8")

                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(
                  url,
                  data=data,
                  headers=headers,
                  method=method
              )

              try:

                  with urllib.request.urlopen(
                      req,
                      timeout=30
                  ) as response:

                      raw = response.read().decode("utf-8")

                      return json.loads(raw)

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  raise RuntimeError(
                      f"HTTP {e.code} em {url}: {body}"
                  )

              except Exception as e:

                  raise RuntimeError(
                      f"Erro consultando {url}: {e}"
                  )


          # ============================================================
          # CÓDIGO DE SEGURANÇA DA API
          # ============================================================

          def gerar_codigo():

              resposta = request_json(
                  f"{API}/comunes/tiempo-servidor"
              )

              if "tiempoServidor" not in resposta:

                  raise RuntimeError(
                      "tiempo-servidor não retornou "
                      "'tiempoServidor'"
                  )

              timestamp = str(
                  resposta["tiempoServidor"]
              )

              mensagem = (
                  f"{SECURITY_VALUE}:{timestamp}"
              ).encode("utf-8")

              assinatura = hmac.new(
                  SECURITY_VALUE.encode("utf-8"),
                  mensagem,
                  hashlib.sha256
              ).digest()

              codigo = base64.b64encode(
                  assinatura
              ).decode("ascii")

              return codigo, timestamp


          # ============================================================
          # DISPONIBILIDADE DAS ROTAS
          # ============================================================

          def consultar_disponibilidade(data_visita):

              codigo, timestamp = gerar_codigo()

              payload = {
                  "lugar": LUGAR,
                  "fecha": data_visita,
                  "code": codigo,
                  "punto": PUNTO,
                  "timestamp": timestamp
              }

              return request_json(
                  f"{API}/comunes/disponibilidad-actual",
                  method="POST",
                  payload=payload
              )


          # ============================================================
          # TOTAL DE TICKETS ENTREGUES NO CICLO
          # ============================================================

          def consultar_total_entregues(data_ciclo):

              url = (
                  f"{API}/recaudador/ticket/"
                  f"tickets-por-fecha/{data_ciclo}"
              )

              try:

                  resposta = request_json(url)

                  valor = resposta.get(
                      "totalticket"
                  )

                  if valor is None:
                      return None

                  valor = int(valor)

                  if valor < 0:
                      return None

                  return valor

              except Exception as erro:

                  print(
                      "AVISO: não foi possível obter "
                      f"TOTAL entregues: {erro}"
                  )

                  return None


          # ============================================================
          # NORMALIZAÇÃO DO JSON DE ROTAS
          # ============================================================

          def achatar_rotas(obj):

              resultado = []

              def caminhar(x, contexto=None):

                  if contexto is None:
                      contexto = {}

                  if isinstance(x, list):

                      for item in x:
                          caminhar(
                              item,
                              contexto
                          )

                      return

                  if not isinstance(x, dict):
                      return

                  atual = dict(contexto)

                  for chave, valor in x.items():

                      if (
                          chave != "rutas"
                          and not isinstance(
                              valor,
                              (list, dict)
                          )
                      ):

                          atual[chave] = valor

                  if isinstance(
                      x.get("rutas"),
                      list
                  ):

                      for rota in x["rutas"]:

                          if isinstance(
                              rota,
                              dict
                          ):

                              combinado = dict(
                                  atual
                              )

                              combinado.update(
                                  rota
                              )

                              caminhar(
                                  combinado,
                                  atual
                              )

                      return

                  if "ncupoActual" in x:

                      resultado.append(
                          atual
                      )

                      return

                  for valor in x.values():

                      if isinstance(
                          valor,
                          (list, dict)
                      ):

                          caminhar(
                              valor,
                              atual
                          )

              caminhar(obj)

              return resultado


          # ============================================================
          # IDENTIFICAÇÃO DO CÓDIGO DA ROTA
          # ============================================================

          def codigo_rota(rota):

              texto = str(
                  rota.get(
                      "ruta",
                      ""
                  )
              )

              encontrado = re.search(
                  r"Ruta\s+([123]-[A-Z])",
                  texto,
                  flags=re.IGNORECASE
              )

              if not encontrado:
                  return None

              return encontrado.group(
                  1
              ).upper()


          # ============================================================
          # TESTE DE ESGOTAMENTO TOTAL
          #
          # Replica a lógica encontrada no site:
          # o ciclo só avança quando TODAS as rotas
          # daquele dia chegam a ncupoActual == 0.
          # ============================================================

          def todas_rotas_esgotadas(rotas):

              if not rotas:

                  raise RuntimeError(
                      "API não retornou nenhuma rota."
                  )

              for rota in rotas:

                  if "ncupoActual" not in rota:
                      return False

                  try:

                      disponivel = int(
                          rota[
                              "ncupoActual"
                          ]
                      )

                  except Exception:

                      return False

                  if disponivel != 0:
                      return False

              return True


          # ============================================================
          # IDENTIFICAÇÃO DE ROTAS DO CIRCUITO 3
          # ============================================================

          def eh_circuito_3(rota):

              codigo = codigo_rota(
                  rota
              )

              if (
                  codigo
                  and codigo.startswith("3-")
              ):
                  return True

              try:

                  if int(
                      rota.get(
                          "nidCircuito"
                      )
                  ) == 3:
                      return True

              except Exception:
                  pass

              circuito = str(
                  rota.get(
                      "circuito",
                      ""
                  )
              ).lower()

              return (
                  "circuito 3"
                  in circuito
              )


          # ============================================================
          # EXECUÇÃO PRINCIPAL
          # ============================================================

          def executar():

              agora = datetime.now(
                  ZoneInfo(
                      "America/Lima"
                  )
              )

              hoje = agora.date()

              consultas = {}

              indice_ativo = None


              # --------------------------------------------------------
              # Verifica D+1, depois D+2 e depois D+3.
              #
              # Só avança para o próximo dia se TODAS as rotas
              # do dia anterior estiverem zeradas.
              # --------------------------------------------------------

              for indice in (1, 2, 3):

                  data_visita = (
                      hoje
                      + timedelta(
                          days=indice
                      )
                  )

                  bruto = consultar_disponibilidade(
                      data_visita.isoformat()
                  )

                  rotas = achatar_rotas(
                      bruto
                  )

                  esgotado = (
                      todas_rotas_esgotadas(
                          rotas
                      )
                  )

                  consultas[indice] = {
                      "data": data_visita,
                      "rotas": rotas,
                      "esgotado": esgotado
                  }

                  indice_ativo = indice

                  if not esgotado:
                      break


              ativo = consultas[
                  indice_ativo
              ]

              rotas_ativas = ativo[
                  "rotas"
              ]


              # --------------------------------------------------------
              # O site usa:
              #
              # fechaDisponibilidad =
              # fechaBase + diaActualCiclo + 1
              #
              # fechaTickets =
              # fechaBase + diaActualCiclo
              #
              # Como:
              #
              # indice_ativo = diaActualCiclo + 1
              #
              # a data usada no endpoint tickets-por-fecha é:
              #
              # hoje + indice_ativo - 1
              # --------------------------------------------------------

              data_ciclo = (
                  hoje
                  + timedelta(
                      days=indice_ativo - 1
                  )
              )

              total_entregues = (
                  consultar_total_entregues(
                      data_ciclo.isoformat()
                  )
              )


              # --------------------------------------------------------
              # MAPA DAS ROTAS
              # --------------------------------------------------------

              mapa = {}

              for rota in rotas_ativas:

                  codigo = codigo_rota(
                      rota
                  )

                  if codigo:

                      mapa[codigo] = rota


              def valor(codigo):

                  rota = mapa.get(
                      codigo
                  )

                  if rota is None:
                      return "?"

                  valor_atual = rota.get(
                      "ncupoActual"
                  )

                  if valor_atual is None:
                      return "?"

                  return str(
                      valor_atual
                  )


              # --------------------------------------------------------
              # D+1 / D+2 / D+3
              # --------------------------------------------------------

              if consultas[1][
                  "esgotado"
              ]:

                  d1 = "ESGOTADO"

              else:

                  d1 = consultas[1][
                      "data"
                  ].isoformat()


              d2 = (
                  "sim"
                  if 2 in consultas
                  else "não"
              )

              d3 = (
                  "sim"
                  if 3 in consultas
                  else "não"
              )


              # --------------------------------------------------------
              # TOTAL ENTREGUES
              # --------------------------------------------------------

              if total_entregues is None:

                  entregues_texto = "?"

                  disponiveis_total = None

              else:

                  entregues_texto = str(
                      total_entregues
                  )

                  disponiveis_total = (
                      TOTAL_COTA
                      - total_entregues
                  )


              # --------------------------------------------------------
              # ROTAS 3 EXATAMENTE COMO A API EXIBIU
              # --------------------------------------------------------

              rotas_3 = []

              for rota in rotas_ativas:

                  if eh_circuito_3(
                      rota
                  ):

                      rotas_3.append({
                          "codigo":
                              codigo_rota(
                                  rota
                              ),
                          "rotulo":
                              rota.get(
                                  "ruta"
                              ),
                          "ncupo":
                              rota.get(
                                  "ncupo"
                              ),
                          "disponiveis":
                              rota.get(
                                  "ncupoActual"
                              )
                      })


              # --------------------------------------------------------
              # ROTA 3 EXTRA, CASO A API CRIE OUTRA ALÉM DE A/B/C/D
              # --------------------------------------------------------

              codigos_padrao = {
                  "3-A",
                  "3-B",
                  "3-C",
                  "3-D"
              }

              codigos_extras = sorted(
                  codigo
                  for codigo in mapa
                  if (
                      codigo.startswith(
                          "3-"
                      )
                      and codigo
                      not in codigos_padrao
                  )
              )


              extras_texto = ""

              for codigo in codigos_extras:

                  extras_texto += (
                      f"; {codigo}="
                      f"{valor(codigo)}"
                  )


              # --------------------------------------------------------
              # IDENTIFICAÇÃO DO CICLO ATIVO
              # --------------------------------------------------------

              ciclo_texto = (
                  f"D+{indice_ativo}"
              )

              data_ativa = ativo[
                  "data"
              ].isoformat()


              # --------------------------------------------------------
              # LINHA PRINCIPAL
              # --------------------------------------------------------

              linha = (
                  f"{agora:%Y-%m-%d %H:%M} Peru"
                  f" | alvo={data_ativa} ({ciclo_texto})"
                  f" | TOTAL entregues="
                  f"{entregues_texto}/{TOTAL_COTA}"
                  f" | vende:"
                  f" D+1={d1};"
                  f" D+2={d2};"
                  f" D+3={d3}"
                  f" | 2-A={valor('2-A')};"
                  f" 2-B={valor('2-B')};"
                  f" 3-A={valor('3-A')};"
                  f" 3-B={valor('3-B')};"
                  f" 3-C={valor('3-C')};"
                  f" 3-D={valor('3-D')}"
                  f"{extras_texto}"
                  f" | obs: -"
              )


              # --------------------------------------------------------
              # JSON ESTRUTURADO PARA ANÁLISE POSTERIOR
              #
              # Esta linha facilitará reconstruir todas as leituras
              # automaticamente ao final da semana.
              # --------------------------------------------------------

              registro = {
                  "timestamp_lima":
                      agora.isoformat(),

                  "data_lima":
                      agora.strftime(
                          "%Y-%m-%d"
                      ),

                  "hora_lima":
                      agora.strftime(
                          "%H:%M:%S"
                      ),

                  "ciclo_ativo":
                      ciclo_texto,

                  "data_ativa":
                      data_ativa,

                  "data_ciclo_tickets":
                      data_ciclo.isoformat(),

                  "total_entregues":
                      total_entregues,

                  "total_cota":
                      TOTAL_COTA,

                  "total_disponiveis":
                      disponiveis_total,

                  "d1_esgotado":
                      consultas[1][
                          "esgotado"
                      ],

                  "d2_abriu":
                      2 in consultas,

                  "d3_abriu":
                      3 in consultas,

                  "rotas": {
                      codigo: {
                          "rotulo":
                              rota.get(
                                  "ruta"
                              ),
                          "ncupo":
                              rota.get(
                                  "ncupo"
                              ),
                          "disponiveis":
                              rota.get(
                                  "ncupoActual"
                              )
                      }
                      for codigo, rota
                      in mapa.items()
                  },

                  "rotas_3":
                      rotas_3
              }


              # --------------------------------------------------------
              # SAÍDA
              # --------------------------------------------------------

              print()

              print(
                  "======================================"
              )

              print(
                  "RESULTADO DO MONITOR"
              )

              print(
                  "======================================"
              )

              print(
                  linha
              )

              print()


              print(
                  "MONITOR_JSON="
                  + json.dumps(
                      registro,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

              print()


              print(
                  "DATA ATIVA:",
                  data_ativa,
                  f"({ciclo_texto})"
              )

              print(
                  "DATA DO CICLO DE TICKETS:",
                  data_ciclo.isoformat()
              )

              print(
                  "TOTAL ENTREGUES:",
                  f"{entregues_texto}/{TOTAL_COTA}"
              )

              if (
                  disponiveis_total
                  is not None
              ):

                  print(
                      "TOTAL AINDA DISPONÍVEL "
                      "NO CICLO:",
                      disponiveis_total
                  )

              print()


              print(
                  "ROTAS RECEBIDAS DA API:"
              )


              for rota in rotas_ativas:

                  print(
                      rota.get(
                          "ruta",
                          "?"
                      ),
                      "| ncupo:",
                      rota.get(
                          "ncupo",
                          "?"
                      ),
                      "| ncupoActual:",
                      rota.get(
                          "ncupoActual",
                          "?"
                      )
                  )


              print()

              print(
                  "ROTAS 3 RECEBIDAS:"
              )


              if not rotas_3:

                  print(
                      "Nenhuma rota do "
                      "Circuito 3 retornada."
                  )

              else:

                  for rota in rotas_3:

                      print(
                          rota[
                              "rotulo"
                          ],
                          "| código:",
                          rota[
                              "codigo"
                          ],
                          "| disponíveis:",
                          rota[
                              "disponiveis"
                          ]
                      )


              print()

              print(
                  "======================================"
              )


          # ============================================================
          # REGRA DE OURO
          # ============================================================

          try:

              executar()

          except Exception as erro:

              agora = datetime.now(
                  ZoneInfo(
                      "America/Lima"
                  )
              )

              print(
                  f"SEM DADOS | "
                  f"{agora:%Y-%m-%d %H:%M} Peru"
                  f" | motivo: {erro}"
              )

              raise

          PY
